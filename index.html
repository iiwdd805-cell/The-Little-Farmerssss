<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نشاط الأسبوع: المزارع الصغير</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#c9eef5;--ground:#8fd16b;--pot:#d9784a;--pot-in:#a9582f;--rim:#e8905f;--soil:#8a5a35;--wet:#3d2514;--ink:#1d4048;--btn:#fffbe6;--stem:#3f9b3a;--fruit:#e5392f;--cloud:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#12303a;--ground:#2f6b3a;--ink:#e3f6f4;--btn:#223c40;--cloud:#8fa5bd}}
:root[data-theme="dark"]{--sky:#12303a;--ground:#2f6b3a;--ink:#e3f6f4;--btn:#223c40;--cloud:#8fa5bd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%;background:linear-gradient(to bottom,var(--sky) 60%,var(--ground) 60%) fixed;color:var(--ink);font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif}
main{max-width:460px;margin:0 auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:5px}
#logo{display:block;margin:0 auto;height:62px;width:auto;max-width:80%;background:#fff;border-radius:14px;padding:4px 12px;box-sizing:content-box}
#snd{align-self:center;font:inherit;font-weight:800;font-size:1rem;color:var(--ink);background:var(--btn);border:3px solid var(--ink);border-radius:22px;padding:4px 16px;cursor:pointer}
h1{margin:0;font-size:1.3rem;line-height:1.35;font-weight:800;text-align:center}
#msg{margin:0;min-height:2.6em;text-align:center;font-size:1.2rem;font-weight:800;display:flex;align-items:center;justify-content:center}
#dots{display:flex;justify-content:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);opacity:.5}
.dot.on{background:var(--ink);opacity:1}
svg.scene{width:100%;height:auto;max-height:36vh;max-height:34dvh;display:block}
#tray{display:flex;gap:10px}
#tray button,#again{font:inherit;font-weight:800;font-size:1.05rem;color:var(--ink);background:var(--btn);border:3px solid var(--ink);border-radius:22px;padding:8px 4px;cursor:pointer}
#tray button{flex:1;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#tray .ic{height:44px;width:auto}
#tray .em{font-size:2rem;line-height:44px}
#tray button:disabled{opacity:.4;cursor:default}
#tray button:not(:disabled){box-shadow:0 0 0 5px #ffd23f}
#tray button.done{opacity:.7}
#again{display:none;min-height:56px;font-size:1.2rem}
#again.show{display:block}
button:focus-visible,.fruit:focus-visible{outline:4px solid #1a73e8;outline-offset:2px}
#soilg{transform:translateY(70px);transition:transform .5s ease}
.wet{opacity:0;transition:opacity .6s}
#seeds{transition:opacity .6s}
.stem{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 1.2s ease}
.pop{transform:scale(0);transform-box:fill-box;transform-origin:50% 50%;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.pop.show{transform:scale(1)}
.fruit{cursor:pointer}
.fruit.show.gone{transform:scale(0);pointer-events:none}
#jug,#packet,#stream{opacity:0}
.conf{position:fixed;top:-30px;font-size:2rem;animation:cf 2.2s ease-in forwards;pointer-events:none}
@keyframes cf{to{transform:translateY(105vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.conf{animation-duration:.01s}.stem,.pop,#soilg{transition-duration:.01s}}
</style>
</head>

const parts=[...document.querySelectorAll('.lf,.fruit')],fruits=[...document.querySelectorAll('.fruit')],stems=[...document.querySelectorAll('.stem')];
let step=0,soil=0,water=0,picked=0,busy=false,fin=false;
let soundOn=true,voice=null,lastSpoken='',heard=false;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.filter(x=>/^ar/i.test(x.lang)).sort((a,b)=>(/natural|google|online/i.test(b.name)?1:0)-(/natural|google|online/i.test(a.name)?1:0))[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){
  lastSpoken=t;
  if(!soundOn||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/\((\d)\/(\d)\)/g,'$1 من $2'));
    u.lang='ar-SA';if(voice)u.voice=voice;u.rate=.8;u.pitch=1;u.onstart=()=>{heard=true};
    speechSynthesis.speak(u);
  }catch(e){}
}
const say=(t,v)=>{msg.textContent=t;speak(v||t)};
$('snd').onclick=()=>{
  soundOn=!soundOn;$('snd').textContent=soundOn?'🔊 الصوت: يعمل':'🔇 الصوت: متوقف';$('snd').setAttribute('aria-pressed',soundOn);
  if(soundOn)speak(lastSpoken||msg.textContent);else if('speechSynthesis' in window)speechSynthesis.cancel();
};
function ui(){
  btns.forEach((b,i)=>{b.disabled=busy||fin||i!==step;b.classList.toggle('done',i<step)});
  const p=fin?4:Math.min(step,3);dots.forEach((d,i)=>d.classList.toggle('on',i<p));
}
function reset(){
  step=soil=water=picked=0;busy=fin=false;
  $('soilg').style.transform='translateY(70px)';wets.forEach(w=>w.style.opacity=0);
  $('seeds').innerHTML='';$('seeds').style.opacity=1;
  stems.forEach(s=>s.style.transform='scaleY(0)');parts.forEach(e=>e.classList.remove('show','gone'));
  $('load').style.opacity=1;$('again').classList.remove('show');
  msg.textContent='اضغط على جاروف التراب وضع التراب في الحوض';lastSpoken='مَرْحَبًا بِكَ فِي نَشَاطِ الْأُسْبُوعِ: الْمُزَارِعُ الصَّغِيرُ. الْخُطْوَةُ الْأُولَى: اضْغَطْ عَلَى زِرِّ جَارُوفِ التُّرَابِ، لِنَضَعَ التُّرَابَ فِي الْحَوْضِ. سَنُكَرِّرُ ذَلِكَ ثَلَاثَ مَرَّاتٍ.';ui();
}
function ripple(x){
  const e=document.createElementNS(NS,'ellipse');
  [['cx',x],['cy',250],['rx',6],['ry',2.5],['fill','none'],['stroke','#9fd8ff'],['stroke-width',2.5]].forEach(([k,v])=>e.setAttribute(k,v));
  e.style.transformBox='fill-box';e.style.transformOrigin='50% 50%';
  $('fx').appendChild(e);
  e.animate([{transform:'scale(1)',opacity:.9},{transform:'scale(7)',opacity:0}],{duration:1100,fill:'both'}).finished.then(()=>e.remove());
}
function crumbs(){
  for(let i=0;i<7;i++){
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',158+Math.random()*16);c.setAttribute('cy',216);c.setAttribute('r',3.5);c.setAttribute('fill','var(--soil)');
    $('fx').appendChild(c);
    c.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(36px)',opacity:1}],{duration:450,delay:i*40,fill:'both'}).finished.then(()=>c.remove());
  }
}
async function scoop(){
  busy=true;ui();
  const a=$('shovel').animate([
    {transform:'translate(36px,284px) rotate(0deg)'},
    {transform:'translate(66px,232px) rotate(-10deg)',offset:.3},
    {transform:'translate(150px,206px) rotate(-75deg)',offset:.55},
    {transform:'translate(150px,206px) rotate(-75deg)',offset:.7},
    {transform:'translate(66px,232px) rotate(-10deg)',offset:.88},
    {transform:'translate(36px,284px) rotate(0deg)'}],{duration:1900,easing:'ease-in-out',fill:'forwards'});
  await wait(1100);
  $('load').style.opacity=0;crumbs();soil++;
  $('soilg').style.transform='translateY('+(3-soil)*23+'px)';
  await a.finished;$('load').style.opacity=1;busy=false;
  if(soil>=3){step=1;say('ممتاز! الآن انثر البذور 🌰','مُمْتَازٌ! امْتَلَأَ الْحَوْضُ بِالتُّرَابِ. الْخُطْوَةُ الثَّانِيَةُ: اضْغَطْ عَلَى زِرِّ الْبُذُورِ، لِنَنْثُرَ الْبُذُورَ فَوْقَ التُّرَابِ.')}else say('أحسنت! مرة أخرى ('+soil+'/3)',(soil==1?'أَحْسَنْتَ! وَضَعْنَا التُّرَابَ مَرَّةً وَاحِدَةً. اضْغَطْ عَلَى جَارُوفِ التُّرَابِ مَرَّةً أُخْرَى.':'أَحْسَنْتَ! وَضَعْنَا التُّرَابَ مَرَّتَيْنِ. بَقِيَتْ مَرَّةٌ وَاحِدَةٌ. اضْغَطْ عَلَى جَارُوفِ التُّرَابِ.'));
  ui();
}
async function sow(){
  busy=true;ui();
  $('packet').animate([
    {transform:'translate(90px,160px) rotate(0deg)',opacity:0},
    {transform:'translate(90px,196px) rotate(150deg)',opacity:1,offset:.2},
    {transform:'translate(255px,196px) rotate(150deg)',opacity:1,offset:.85},
    {transform:'translate(255px,150px) rotate(0deg)',opacity:0}],{duration:1800});
  for(let i=0;i<15;i++){
    const x=98+i*10.5+Math.random()*5,y=262+Math.random()*38,e=document.createElementNS(NS,'ellipse');
    [['cx',x],['cy',y],['rx',5],['ry',3.5],['fill','#f3d9a4'],['stroke','#6b4423'],['stroke-width',2]].forEach(([k,v])=>e.setAttribute(k,v));
    $('seeds').appendChild(e);
    e.animate([{transform:'translateY('+(196-y)+'px)',opacity:0},{opacity:1,offset:.1},{transform:'translateY(0)',opacity:1}],{duration:500,delay:360+(x-90)/165*1170,fill:'both'});
  }
  await wait(2100);busy=false;step=2;say('رائع! الآن اسقِ التراب بوعاء الماء ثلاث مرات 💧','رَائِعٌ! تَمَّ نَثْرُ الْبُذُورِ. الْخُطْوَةُ الثَّالِثَةُ: اضْغَطْ عَلَى زِرِّ وِعَاءِ الْمَاءِ، لِنَسْقِيَ التُّرَابَ ثَلَاثَ مَرَّاتٍ.');ui();
}
async function pour(){
  busy=true;ui();
  const X=XS[water],T=`translate(${X-16}px,185px)`;
  $('stream').setAttribute('x',X-2);
  $('jug').animate([
    {transform:`translate(${X-16}px,120px) rotate(0deg)`,opacity:0},
    {transform:T+' rotate(0deg)',opacity:1,offset:.25},
    {transform:T+' rotate(60deg)',opacity:1,offset:.4},
    {transform:T+' rotate(60deg)',opacity:1,offset:.8},
    {transform:T+' rotate(0deg)',opacity:1,offset:.9},
    {transform:`translate(${X-16}px,120px) rotate(0deg)`,opacity:0}],{duration:2200});
  $('stream').animate([{opacity:0,transform:'scaleY(0)'},{opacity:.9,transform:'scaleY(1)',offset:.15},{opacity:.9,transform:'scaleY(1)',offset:.85},{opacity:0,transform:'scaleY(1)'}],{duration:880,delay:880});
  await wait(1400);wets[0].style.opacity=(water+1)*.2;ripple(X);water++;
  await wait(850);
  if(water>=3){say('البذور تنمو... 🌱','تَمَّ سَقْيُ التُّرَابِ ثَلَاثَ مَرَّاتٍ. انْظُرْ، الْبُذُورُ تَنْمُو وَتُصْبِحُ نَبَاتَاتٍ صَغِيرَةً.');grow()}else{busy=false;say('اسقِ التراب مرة أخرى ('+water+'/3)',water==1?'جَمِيلٌ! سَقَيْنَا التُّرَابَ مَرَّةً وَاحِدَةً. اضْغَطْ عَلَى وِعَاءِ الْمَاءِ لِنَسْقِيَهُ مَرَّةً ثَانِيَةً.':'جَمِيلٌ! سَقَيْنَا التُّرَابَ مَرَّتَيْنِ. بَقِيَتْ مَرَّةٌ وَاحِدَةٌ. اضْغَطْ عَلَى وِعَاءِ الْمَاءِ.');ui()}
}
async function grow(){
  await wait(300);$('seeds').style.opacity=0;stems.forEach(s=>s.style.transform='scaleY(.35)');
  await wait(1200);stems.forEach(s=>s.style.transform='scaleY(.7)');
  await wait(1200);stems.forEach(s=>s.style.transform='scaleY(1)');document.querySelectorAll('.lf').forEach(l=>l.classList.add('show'));
  await wait(1200);fruits.forEach((f,i)=>setTimeout(()=>f.classList.add('show'),i*300));
  await wait(900);busy=false;step=3;say('ظهرت الثمار! اضغط عليها لتقطفها 🍅','ظَهَرَتِ الثِّمَارُ الْحَمْرَاءُ! الْخُطْوَةُ الْأَخِيرَةُ: اضْغَطْ عَلَى كُلِّ ثَمَرَةٍ لِتَقْطِفَهَا.');ui();
}
btns[0].onclick=scoop;btns[1].onclick=sow;btns[2].onclick=pour;
fruits.forEach(f=>{
  const pick=()=>{
    if(!f.classList.contains('show')||f.classList.contains('gone'))return;
    f.classList.add('gone');picked++;
    if(picked>=3){fin=true;say('أحسنت! قطفت كل الثمار 🎉','أَحْسَنْتَ! قَطَفْتَ كُلَّ الثِّمَارِ. أَنْتَ مُزَارِعٌ مَاهِرٌ! يُمْكِنُكَ الزِّرَاعَةُ مِنْ جَدِيدٍ.');$('again').classList.add('show');ui();party()}
    else say('🍅 '+picked+'/3',(picked==1?'قَطَفْتَ ثَمَرَةً وَاحِدَةً. اقْطِفِ الْبَاقِيَ.':'قَطَفْتَ ثَمَرَتَيْنِ. بَقِيَتْ ثَمَرَةٌ وَاحِدَةٌ.'));
  };
  f.onclick=pick;f.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')pick()};
});
function party(){
  const em=['🎉','🍅','⭐','🌟','🎈'];
  for(let i=0;i<14;i++){
    const s=document.createElement('span');s.className='conf';s.textContent=em[i%5];
    s.style.left=Math.random()*92+'%';s.style.animationDelay=Math.random()*.8+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),3200);
  }
}
$('again').onclick=reset;
reset();
setTimeout(()=>{if(!heard)speak(lastSpoken)},400);
const firstTouch=()=>{if(!heard)speak(lastSpoken);['pointerdown','keydown','touchstart'].forEach(t=>document.removeEventListener(t,firstTouch,true))};
['pointerdown','keydown','touchstart'].forEach(t=>document.addEventListener(t,firstTouch,true));
</script>
